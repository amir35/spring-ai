spring.application.name=spring-ai

#spring.ai.openai.api-key=${OPENAI_API_KEY}

# Ollama runs locally on Windows laptop.
spring.ai.ollama.base-url=http://localhost:11434

# Chat model: writes the final answer.
spring.ai.ollama.chat.model=llama3.2:1b

# Embedding model: converts text into vectors for similarity search.
spring.ai.ollama.embedding.model=nomic-embed-text